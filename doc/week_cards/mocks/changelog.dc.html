    const VM = {

          { label: 'SUN 2', commits: { story_time_v1: 9, openstage: 4 }, kind: 'shipped', headline: 'Story Time now reads bedtime stories aloud in three voices, and one is a dragon' }
        ]
      },
      // Invented zero week: no commits and one post. Its last week is the w7 card below, so the deltas match that card.
      w0: {
        iso: '2026-W35', dates: 'Aug 24 – 30, 2026', goal: 'Back to the editor on Monday',
        prev: { commits: 31, active: 7, shipped: 0, published: 1 },
        code: null,
        days: [
          { label: 'MON 24', commits: {} },
          { label: 'TUE 25', commits: {} },
          { label: 'WED 26', commits: {} },
          { label: 'THU 27', commits: {} },
          { label: 'FRI 28', commits: {}, kind: 'published', headline: 'Why I stopped coding for a week to talk to twenty users' },
          { label: 'SAT 29', commits: {} },
          { label: 'SUN 30', commits: {} }
        ]
      },
      // Invented: seven days straight, the densest one-line week, with an emoji the card strips.
      w7: {
        iso: '2026-W34', dates: 'Aug 17 – 23, 2026', goal: 'Take a real day off',
        prev: { commits: 21, active: 4, shipped: 0, published: 1 },
        code: { files: 58, added: 2840, removed: 910, invented: true },
        days: [
          { label: 'MON 17', commits: { openstage: 4 }, kind: 'built', headline: 'Week card editor: pick what goes on the card' },
          { label: 'TUE 18', commits: { openstage: 6, 'wheels-off': 1 }, kind: 'built', headline: '6 commits in openstage', auto: true },
          { label: 'WED 19', commits: { 'wheels-off': 5 }, kind: 'built', headline: 'Toon outlines on every car \u{1F3CE}\u{FE0F}' },
          { label: 'THU 20', commits: { 'wheels-off': 2 }, kind: 'built', headline: '2 commits in wheels-off', auto: true },
          { label: 'FRI 21', commits: { openstage: 3 }, kind: 'built', headline: 'Dark mode for the week card' },
          { label: 'SAT 22', commits: { 'wheels-off': 7, openstage: 1 }, kind: 'built', headline: 'Night track with real headlights' },
          { label: 'SUN 23', commits: { openstage: 2 }, kind: 'published', headline: 'Wrote up the week on Bluesky' }
        ]
      }
    };

    // ---------- Props and the derived week ----------
    const dark = this.props.theme === 'dark';
    const weekKey = WEEKS[this.props.week] ? this.props.week : 'w41';
    const wk = WEEKS[weekKey];
    const showCode = this.props.code !== 'hide' && Boolean(wk.code);
    const uid = weekKey + (dark ? 'd' : 'l') + (this.props.identity || 'tux');
    const [isoYear, isoWeekStr] = wk.iso.split('-W');
    const weekN = Number(isoWeekStr);
    // The app's count line, rebuilt from the day's commits. The number is always the day's total:
    // one project '6 commits in wheels-off', two '6 commits in wheels-off and openstage', more '10 commits across 6 projects'.
    const nCommits = (n) => `${fmt(n)} commit${n === 1 ? '' : 's'}`;
    const autoLine = (ps, n) => (ps.length === 1 ? `${nCommits(n)} in ${cutName(ps[0], 22)}`
      : ps.length === 2 ? `${nCommits(n)} in ${cutName(ps[0], 22)} and ${cutName(ps[1], 22)}`
        : `${nCommits(n)} across ${ps.length} projects`);
    // The short form, when the full line would push the project pills out.
    const autoShort = (ps, n) => (ps.length > 1 ? `${nCommits(n)} across ${ps.length} projects` : nCommits(n));
    const days = wk.days.map((d) => {
      const [dow, dom] = d.label.split(' ');
      const projects = Object.keys(d.commits).filter((p) => d.commits[p] > 0)
        .sort((a, b) => d.commits[b] - d.commits[a] || a.localeCompare(b));
      const total = projects.reduce((a, p) => a + d.commits[p], 0);
      const words = d.auto ? '' : stripEmoji(d.headline);
      const kind = d.kind || (total ? 'built' : '');
      return {
        ...d, dow, dom, projects, total, words, kind,
        named: Boolean(words),
        // A day counts as active when it has commits or a logged launch or post, as data.json counts it.
        active: total > 0 || Boolean(words) || kind === 'published' || kind === 'shipped',
        autoText: total ? autoLine(projects, total) : '',
        autoShort: total ? autoShort(projects, total) : ''
      };
    });
    const commits = days.reduce((s, d) => s + d.total, 0);
    const activeDays = days.filter((d) => d.active).length;
    const shipped = days.filter((d) => d.kind === 'shipped').length;
    const published = days.filter((d) => d.kind === 'published').length;
    const maxDay = Math.max(1, ...days.map((d) => d.total));
    const nNamed = days.filter((d) => d.named).length;


    // ---------- Palette: paper or night, Openstage's own ink and one accent (deep green) ----------
    // faint is the quietest type on the card (the unused strip letters, the diffstat) and still holds 3:1.
    const P = dark
      ? { bg: '#0E1012', ink: '#ECEEEF', muted: '#8E959A', faint: '#6B7378', rule: '#22272B', ruleStrong: '#394046', cellLine: '#454D54', accent: '#00BA7C', onAccent: '#0E1012', avatarRing: '#2A3035' }
      : { bg: '#F8F7F3', ink: '#14171A', muted: '#62665F', faint: '#8A8E86', rule: '#E4E3DC', ruleStrong: '#CDCBC1', cellLine: '#C3C1B6', accent: '#00875A', onAccent: '#FFFFFF', avatarRing: '#D9D7CE' };
    // Activity cells: the accent mixed into the ground in four steps, as solid colours the server can write.
    const LV = dark ? [0.34, 0.54, 0.76, 1] : [0.22, 0.44, 0.7, 1];
    const t = { ...P, lvl1: mix(P.bg, P.accent, LV[0]), lvl2: mix(P.bg, P.accent, LV[1]), lvl3: mix(P.bg, P.accent, LV[2]), lvl4: P.accent,
      // A shipped entry sits on a wash of the accent, so the week's launches lead the list.
      wash: dark ? mix(P.bg, P.accent, 0.13) : '#E1F0E8',
      // Pills are the ink at low opacity, so they sit the same on the paper and on a launch's wash.
      pillA: dark ? 0.1 : 0.065,
      pillText: mix(P.muted, P.ink, 0.25) };

    // ---------- The display list ----------
    const FF = { i: "'Inter', sans-serif", m: "'DM Mono', monospace" };
    const FW = { i4: 400, i5: 500, i6: 600, m4: 400, m5: 500 };
    const texts = [], textsR = [], dots = [], icons = [];
    const g = { wash: '', rules: '', rulesStrong: '', cellEmpty: '', cellPost: '', cell1: '', cell2: '', cell3: '', cell4: '', pills: '', tagShip: '', tagPub: '', tagBuilt: '', chip: '' };
    const piece = (text, f, size, x, baseline, color, ls = 0, tnum = false) => ({
      text, ff: FF[f[0]], fw: FW[f], fs: r2(size), ls, num: tnum ? 'tabular-nums' : 'normal',
      x: r2(x), y: r2(baseline - baseOf(f) * size), color
    });
    const put = (text, f, size, x, baseline, color, ls = 0, tnum = false) => {
      texts.push(piece(text, f, size, x, baseline, color, ls, tnum));
      return x + VW(text, f, size, ls, tnum);
    };
    // Right-aligned type is anchored at its right edge (text-anchor="end" in SVG). Chrome adds the tracking after the
    // last glyph too, so the mock cancels it with margin-right; in the Ruby port, add tracking x size to x for every
    // tracked run anchored at its end.
    const putR = (text, f, size, xEnd, baseline, color, ls = 0, tnum = false) => {
      textsR.push({ ...piece(text, f, size, 0, baseline, color, ls, tnum), r: r2(1200 - xEnd), mr: -ls });
      return xEnd - VW(text, f, size, ls, tnum);
    };

    // ---------- The grid ----------
    // A slim rail on the left (identity, the week's strip, four numbers), and the entries on the rest of the width.
    const L = 60, R = 1140;
    const COL_R = 314;                 // the rail
    const X_DAY = 360, X_HEAD = 452;   // the entries: day and tag column, then the words
    const HEAD_B = 60;                 // shared baseline of the name and the entries header
    const LIST_TOP = 74, FOOT_RULE = 538, FOOT_B = 590;

    // ---------- Identity: avatar, name, the Pro chip, GitHub handle ----------
    const AV = 46;
    const avatar = { x: L, y: 39, s: AV, c: AV / 2, ring: AV / 2 - 0.5, label: `${BUILDER.name}'s avatar` };
    const nameX = L + AV + 14, NAME_LS = -0.01, nameRoom = COL_R - nameX;
    const CHIP_TEXT = 'OPENSTAGE PRO', CHIP_S = 8.5, CHIP_LS = 0.1, CHIP_H = 15, CHIP_GAP = 8;
    const chipTW = VW(CHIP_TEXT, 'm5', CHIP_S, CHIP_LS), chipW = Math.ceil(chipTW) + 12;
    const chipNeed = BUILDER.pro ? CHIP_GAP + chipW : 0;
    const nameW1 = VW(BUILDER.name, 'i6', 1, NAME_LS);
    // The name never loses a letter while it can wrap. In order:
    // 1. one line beside the chip, 20px down to 15px;
    // 2. one line at 15px or more with the chip moved below the name;
    // 3. two balanced lines at 17px down to 15px;
    // 4. two lines at 15px, the second cut at a word.
    let nameLines = null, NAME_S = 20, chipBeside = false;
    const s1 = fit1(Math.min(20, (nameRoom - chipNeed) / nameW1));
    if (s1 >= 15) { nameLines = [BUILDER.name]; NAME_S = s1; chipBeside = BUILDER.pro; }
    if (!nameLines) {
      const s2 = fit1(Math.min(20, nameRoom / nameW1));
      if (s2 >= 15) { nameLines = [BUILDER.name]; NAME_S = s2; }
    }
    for (let s = 17; !nameLines && s >= 15; s -= 0.5) {
      const ls = balance(BUILDER.name, 'i6', s, NAME_LS, nameRoom, 2);
      if (ls) { nameLines = ls; NAME_S = s; }
    }
    if (!nameLines) {
      const ws = BUILDER.name.split(' ');
      let k = 1;
      while (k < ws.length && VW(ws.slice(0, k + 1).join(' '), 'i6', 15, NAME_LS) <= nameRoom) k += 1;
      const first = cutToWidth(ws.slice(0, k).join(' '), 'i6', 15, NAME_LS, nameRoom);
      nameLines = k < ws.length ? [first, cutWords(ws.slice(k).join(' '), 'i6', 15, NAME_LS, nameRoom)] : [first];
      NAME_S = 15;
    }
    const NAME_LH = Math.round(NAME_S * 1.2);
    nameLines.forEach((ln, k) => put(ln, 'i6', NAME_S, nameX, HEAD_B + k * NAME_LH, t.ink, NAME_LS));
    const lastNameB = HEAD_B + (nameLines.length - 1) * NAME_LH;
    const lastNameW = VW(nameLines[nameLines.length - 1], 'i6', NAME_S, NAME_LS);
    // GitHub usernames run to 39 characters; a long one steps down to 10px, then is cut.
    const HANDLE_B = lastNameB + 19, handle = '@' + BUILDER.github;
    const handleRoom = COL_R - nameX - 17;
    const HANDLE_S = fit1(Math.max(10, Math.min(12.5, handleRoom / VW(handle, 'm4', 1))));
    const handleText = cutToWidth(handle, 'm4', HANDLE_S, 0, handleRoom);
    const ghMid = HANDLE_B - cap('m4', HANDLE_S) / 2;
    icons.push({ x: nameX, y: r2(ghMid - 6), w: 12, h: 12, vb: '0 0 16 16', d: GITHUB, fill: t.muted });
    const handleEnd = put(handleText, 'm4', HANDLE_S, nameX + 17, HANDLE_B, t.muted);
    let idBottom = HANDLE_B + 3;
    if (BUILDER.pro) {
      // Beside the name when it fits; else after the handle; else on a line of its own.
      let cx, mid;
      if (chipBeside || nameX + lastNameW + chipNeed <= COL_R) { cx = nameX + lastNameW + CHIP_GAP; mid = lastNameB - cap('i6', NAME_S) / 2; }
      else if (handleEnd + 10 + chipW <= COL_R) { cx = handleEnd + 10; mid = ghMid; }
      else { cx = nameX; mid = HANDLE_B + 17; idBottom = mid + CHIP_H / 2; }
      const top = Math.round(mid - CHIP_H / 2);
      g.chip += rrLine(Math.round(cx), top, chipW, CHIP_H, 3);
      put(CHIP_TEXT, 'm5', CHIP_S, Math.round(cx) + (chipW - chipTW) / 2, top + CHIP_H / 2 + cap('m5', CHIP_S) / 2, t.muted, CHIP_LS);
    }

    // ---------- The entries header: a small tag, the week, and the builder's page ----------
    // 'CHANGELOG · 2026.41' is a tag now, not a title. The year comes from the ISO week (the year its Thursday falls
    // in), never from the dates, so 2026-W53 stays 2026.
    const tagText = `CHANGELOG · ${isoYear}.${isoWeekStr.padStart(2, '0')}`;
    const tagEnd = put(tagText, 'm5', 10.5, X_DAY, HEAD_B, t.accent, 0.14);
    const dateText = `Week ${weekN} · ${wk.dates}`;
    const dateEnd = put(dateText, 'i5', 14, tagEnd + 18, HEAD_B, t.ink, -0.005);
    g.rulesStrong += hLine(X_DAY, R, LIST_TOP - 1);
    // The link is one run anchored at the right edge, the host muted and the builder's page in ink (two tspans).
    const LINK_S = 13.5, LINK_LS = -0.005, MARK = 14;
    const handlePart = BUILDER.page.split('/').pop();
    const hostPart = BUILDER.page.slice(0, BUILDER.page.length - handlePart.length);
    const link = { r: r2(1200 - R), y: r2(HEAD_B - baseOf('i5') * LINK_S), mr: -LINK_LS, fs: LINK_S, ls: LINK_LS, a: hostPart, b: handlePart };
    const linkX = R - VW(BUILDER.page, 'i5', LINK_S, LINK_LS);
    icons.push({ x: Math.round(linkX - 8 - MARK), y: Math.round(HEAD_B - cap('i5', LINK_S) / 2 - MARK / 2), w: MARK, h: MARK, vb: '0 0 512 512', d: OS_MARK, fill: t.muted });

    // ---------- The activity strip: the seven days at a glance ----------
    // A cell's strength is the day's commits on one fixed scale (1–2, 3–7, 8–15, 16+), so cards compare across weeks.
    // A day with a post and no commits is outlined in the accent, and the key below says so. No marks, no stars.
    const CELL = 32, CGAP = 5, CELL_H = 30;
    // The rail's groups (identity, strip, numbers) stack from the top with one even gap between them, so any spare
    // height collects once under the numbers instead of opening holes between the groups.
    const RAIL_GAP = 40;
    const CAP_B = Math.round(idBottom + RAIL_GAP + 4);
    put('COMMITS PER DAY', 'm5', 9.5, L, CAP_B, t.muted, 0.12);
    const CELL_TOP = CAP_B + 12;
    const levelOf = (n) => (n >= 16 ? 4 : n >= 8 ? 3 : n >= 3 ? 2 : n >= 1 ? 1 : 0);
    let stripMarked = 0, postOnly = 0;
    days.forEach((d, i) => {
      const cx = L + i * (CELL + CGAP);
      const lv = levelOf(d.total);
      if (lv) g[`cell${lv}`] += rr(cx, CELL_TOP, CELL, CELL_H, 5);
      else if (d.active) { g.cellPost += rr(cx + 0.75, CELL_TOP + 0.75, CELL - 1.5, CELL_H - 1.5, 4.5); postOnly += 1; }
      else g.cellEmpty += rrLine(cx, CELL_TOP, CELL, CELL_H, 5);
      if (lv || d.active) stripMarked += 1;
      const letter = d.dow[0];
      put(letter, 'm5', 10, cx + CELL / 2 - VW(letter, 'm5', 10) / 2, CELL_TOP + CELL_H + 16, d.active ? t.muted : t.faint);
    });
    if (postOnly) {
      const ky = CELL_TOP + CELL_H + 37;
      g.cellPost += rr(L + 0.75, ky - 10 + 0.75, 16 - 1.5, 11 - 1.5, 3);
      put('Outlined: a post, no commits', 'i4', 11, L + 24, ky, t.muted);
    }

    // ---------- Key numbers: this week and the change from last week ----------
    const prevN = prevWeekOf(wk.iso);
    const stripBottom = postOnly ? CELL_TOP + CELL_H + 37 : CELL_TOP + CELL_H + 16;
    const KEY_ROW = 40, keyTop = Math.round(stripBottom + RAIL_GAP + 12), KEY_BOTTOM = keyTop + 4 * KEY_ROW;
    const KEY_HEAD_B = keyTop - 9;
    const VAL_R = COL_R - 58;
    putR(`W${weekN}`, 'm5', 10, VAL_R, KEY_HEAD_B, t.muted, 0.12);
    putR(`VS W${prevN}`, 'm5', 10, COL_R, KEY_HEAD_B, t.muted, 0.12);
    g.rulesStrong += hLine(L, COL_R, keyTop);
    const keys = [
      ['Commits', commits, wk.prev.commits],
      ['Days active', activeDays, wk.prev.active],
      ['Shipped', shipped, wk.prev.shipped],
      ['Published', published, wk.prev.published]
    ];
    // Every change prints, as a plain count with a true minus sign: '+42', '−16', '±0'. A percent would turn a quiet week
    // into '−80%'. Gains take the accent; drops and ties stay muted, so the card is honest without shouting about a thin week.
    keys.forEach(([label, v, was], i) => {
      const top = keyTop + i * KEY_ROW;
      if (i) g.rules += hLine(L, COL_R, top);
      const b = top + KEY_ROW / 2 + fig('i6', 22) / 2;
      put(label, 'i4', 14, L, b, t.muted);
      putR(fmt(v), 'i6', 22, VAL_R, b, t.ink, -0.01, true);
      const dlt = v - was;
      putR(signed(dlt), 'm5', 12, COL_R, b, dlt > 0 ? t.accent : t.muted, 0, true);
    });
    // The diffstat is a footnote under the key numbers, and the editor can hide it:
    // many investors and clients read lines of code as a vanity number.
    const NOTE_B = KEY_BOTTOM + 24;
    if (showCode) {
      let x = put(`+${fmt(wk.code.added)}`, 'm5', 11, L, NOTE_B, t.muted);
      x = put(`−${fmt(wk.code.removed)}`, 'm5', 11, x + 7, NOTE_B, t.muted);
      put(`lines · ${fmt(wk.code.files)} files`, 'm4', 11, x + 7, NOTE_B, t.faint);
    }

    // ---------- The entries: one row per active day, then one line for the quiet days ----------
    const HEAD_W = R - X_HEAD;
    const HLS = -0.015;
    const PILL_H = 20, TAG_H = 18, TAG_W = 72, META_GAP = 10, PS = 11, SA = 16, DAY_S = 12, DAY_LS = 0.04;
    const TAG_S = 9.5, TAG_LS = 0.1;
    const P_MIN = 9, FOLD_H = 46;
    // Pills are that day's commits: each shows a project and its share. The meta line names the day's total first.
    const pillOf = (d, p, showCnt) => {
      const name = cutName(p, 22), nameW = VW(name, 'm4', PS), cnt = fmt(d.commits[p]), cntW = VW(cnt, 'm5', PS);
      return { p, name, nameW, cnt, cntW, showCnt, w: Math.round(8 + 6 + 6 + nameW + (showCnt ? 5 + cntW : 0) + 8) };
    };
    // What does not fit is counted in plain text: '+3 projects', never a bare '+3' that could be commits.
    const moreText = (k) => `+${k} project${k === 1 ? '' : 's'}`;
    const pillsW = (ps, n) => ps.slice(0, n).reduce((a, q) => a + q.w, 0) + Math.max(0, n - 1) * 6
      + (n < ps.length ? (n ? 10 : 0) + VW(moreText(ps.length - n), 'm4', PS) : 0);
    const drawMeta = (d, mid) => {
      const label = `${fmt(d.total)} ${d.total === 1 ? 'COMMIT' : 'COMMITS'}`;
      const x0 = put(label, 'm5', 10, X_HEAD, mid + cap('m5', 10) / 2, t.muted, 0.1) + 14;
      const ps = d.projects.map((p) => pillOf(d, p, d.projects.length > 1));
      let shown = ps.length;
      while (shown > 0 && x0 + pillsW(ps, shown) > R) shown -= 1;
      let px = Math.round(x0);
      const pillTop = Math.round(mid - PILL_H / 2);
      ps.slice(0, shown).forEach((q) => {
        g.pills += rr(px, pillTop, q.w, PILL_H, PILL_H / 2);
        dots.push({ x: px + 8, y: pillTop + 7, s: 6, r: 3, c: projColor(q.p) });
        put(q.name, 'm4', PS, px + 20, mid + cap('m4', PS) / 2, t.pillText);
        if (q.showCnt) put(q.cnt, 'm5', PS, px + 20 + q.nameW + 5, mid + cap('m5', PS) / 2, t.ink);
        px += q.w + 6;
      });
      if (shown < ps.length) put(moreText(ps.length - shown), 'm4', PS, shown ? px + 4 : px, mid + cap('m4', PS) / 2, t.muted);
      return { label, pills: ps.slice(0, shown).map((q) => `${q.name}${q.showCnt ? ' ' + q.cnt : ''}`), more: ps.length - shown };
    };

    const items = days.filter((d) => d.active);
    const quietDays = days.filter((d) => !d.active).map((d) => d.dow[0] + d.dow.slice(1).toLowerCase());
    const foldText = quietDays.length ? `${quietDays.join(', ')} · no changes` : '';
    const FOLD_H_USED = foldText ? FOLD_H : 0;
    const LIST_H = FOOT_RULE - LIST_TOP;
    const nNamedRows = items.filter((d) => d.named).length;
    // A launch is set a weight heavier, so the week's news leads the list.
    const fontOf = (d) => (d.kind === 'shipped' ? 'i6' : 'i5');
    // One headline size for the list: 22px for a full week, up to 40px when one entry carries the week.
    // It steps down by half pixels until every row fits with its minimum padding.
    const S_MAX = nNamedRows >= 5 ? 22 : nNamedRows === 4 ? 25 : nNamedRows === 3 ? 28 : nNamedRows === 2 ? 34 : 42;
    let S = S_MAX, rows = null, need = 0;
    for (let s = S_MAX; s >= 15.5; s -= 0.5) {
      const rs = items.map((d) => {
        if (!d.named) {
          const text = cutWords(VW(d.autoText, 'i4', SA) <= HEAD_W ? d.autoText : d.autoShort, 'i4', SA, 0, HEAD_W);
          return { d, f: 'i4', size: SA, lh: Math.round(SA * 1.3), lines: [text], meta: false, color: t.muted, content: Math.max(cap('i4', SA) + 6, 10 + TAG_H) };
        }
        const f = fontOf(d), lh = Math.round(s * 1.25);
        const lines = balance(d.words, f, s, HLS, HEAD_W, 3) || [cutWords(d.words, f, s, HLS, HEAD_W)];
        const meta = d.total > 0;
        const tail = meta ? META_GAP + PILL_H : Math.max(0.24 * s, 6);
        return { d, f, size: s, lh, lines, meta, color: t.ink, content: Math.max(cap(f, s) + (lines.length - 1) * lh + tail, 10 + TAG_H) };
      });
      need = rs.reduce((a, r) => a + r.content + 2 * P_MIN, 0) + FOLD_H_USED;
      S = s; rows = rs;
      if (need <= LIST_H) break;
    }
    // Spare height goes to padding, up to a cap that is bigger when fewer entries share the list; what is left
    // after that sits partly above the first row and partly below the last, so a thin week is centred and calm.
    const nRows = Math.max(1, rows.length);
    const spare = LIST_H - need;
    const PAD_CAP = nRows <= 2 ? 50 : nRows <= 4 ? 30 : 22;
    let pad = P_MIN, offset = 0;
    if (spare > 0) {
      const g1 = Math.min(spare / (2 * nRows), PAD_CAP - P_MIN);
      pad += g1;
      offset = (spare - g1 * 2 * nRows) * 0.4;
    } else if (spare < 0) {
      pad = Math.max(3, P_MIN + spare / (2 * nRows));
    }
    const tops = [];
    let acc = LIST_TOP + offset;
    rows.forEach((r) => { tops.push(Math.round(acc)); acc += r.content + 2 * pad; });
    tops.push(Math.round(acc));

    // Tags: SHIPPED is filled, PUBLISHED is outlined in the accent, BUILT is outlined quietly.
    const TAGS = { shipped: 'SHIPPED', published: 'PUBLISHED', built: 'BUILT' };
    const isWashed = (r) => r && r.d.kind === 'shipped' && r.d.named;
    const rowFacts = [];
    rows.forEach((r, i) => {
      const top = tops[i], bot = tops[i + 1], h = bot - top;
      const d = r.d, prev = rows[i - 1];
      // Hairlines part the rows, except next to a launch, whose wash parts it.
      if (i && !isWashed(r) && !isWashed(prev)) g.rules += hLine(X_DAY, R, top);
      const dayText = `${d.dow} ${String(d.dom).padStart(2, '0')}`;
      if (isWashed(r)) g.wash += rr(X_DAY - 14, top + 3, R - X_DAY + 28, h - 6, 8);
      const firstB = top + pad + cap(r.f, r.size);
      // The day sits on the headline's baseline, or at its cap line when the headline is big.
      const dayB = r.size <= 24 ? firstB : top + pad + cap('m5', DAY_S);
      put(dayText, 'm5', DAY_S, X_DAY, r1(dayB), d.named ? t.ink : t.muted, DAY_LS);
      const kindText = TAGS[d.kind] || TAGS.built;
      const tagTop = Math.round(dayB + 10), tm = tagTop + TAG_H / 2;
      const tagTW = VW(kindText, 'm5', TAG_S, TAG_LS), tx = X_DAY + (TAG_W - tagTW) / 2, tb = tm + cap('m5', TAG_S) / 2;
      if (d.kind === 'shipped') {
        g.tagShip += rr(X_DAY, tagTop, TAG_W, TAG_H, 4);
        put(kindText, 'm5', TAG_S, tx, tb, t.onAccent, TAG_LS);
      } else if (d.kind === 'published') {
        g.tagPub += rrLine(X_DAY, tagTop, TAG_W, TAG_H, 4);
        put(kindText, 'm5', TAG_S, tx, tb, t.accent, TAG_LS);
      } else {
        g.tagBuilt += rrLine(X_DAY, tagTop, TAG_W, TAG_H, 4);
        put(kindText, 'm5', TAG_S, tx, tb, t.muted, TAG_LS);
      }
      r.lines.forEach((ln, k) => put(ln, r.f, r.size, X_HEAD, r1(firstB + k * r.lh), r.color, d.named ? HLS : 0));
      const lastB = firstB + (r.lines.length - 1) * r.lh;
      let m = { label: '', pills: [], more: 0 };
      if (r.meta) m = drawMeta(d, Math.round(lastB + META_GAP) + PILL_H / 2);
      rowFacts.push({ day: dayText, tag: kindText, named: d.named, size: r.size, lines: r.lines, total: d.total, meta: m.label, pills: m.pills, more: m.more, h });
    });
    // The quiet days, in one line under the entries.
    if (foldText) {
      const ft = tops[tops.length - 1];
      if (rows.length && !isWashed(rows[rows.length - 1])) g.rules += hLine(X_DAY, R, ft);
      put(foldText, 'i4', 14, X_DAY, r1(ft + FOLD_H / 2 + cap('i4', 14) / 2), t.muted);
    }

    // ---------- Footer: next week's goal, given room ----------
    g.rules += hLine(L, R, FOOT_RULE);
    put('UP NEXT', 'm5', 10.5, L, FOOT_B, t.accent, 0.16);
    const GOAL_LS = -0.01, goalRoom = R - X_DAY;
    const goalText = stripEmoji(wk.goal);
    const GOAL_S = fit1(Math.max(18, Math.min(nRows <= 3 ? 34 : 26, goalRoom / VW(goalText, 'i6', 1, GOAL_LS))));
    const goal = cutWords(goalText, 'i6', GOAL_S, GOAL_LS, goalRoom);
    put(goal, 'i6', GOAL_S, X_DAY, FOOT_B, t.ink, GOAL_LS);

    return {
      t, g, uid, avatar, link, dots, icons, texts, textsR,
      checks: {
        tag: tagText, iso: wk.iso, dates: wk.dates, prevLabel: `W${prevN}`,
        commits, activeDays, shipped, published, stripMarked, prev: wk.prev,
        deltas: keys.map(([label, v, was]) => `${label} ${v} (${signed(v - was)})`),
        code: wk.code ? { files: wk.code.files, added: wk.code.added, removed: wk.code.removed, invented: Boolean(wk.code.invented), shown: showCode } : null,
        name: { lines: nameLines, size: NAME_S, chip: BUILDER.pro }, handle: { text: handleText, size: HANDLE_S },
        S, pad: r1(pad), offset: r1(offset), need, listEnd: tops[tops.length - 1], fold: foldText, goal, goalSize: GOAL_S, rows: rowFacts
      }
    };
  }
}
</script>
