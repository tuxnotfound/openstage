function adv(ch, wt) {
  const c = ch.codePointAt(0);
  if (c >= 48 && c <= 57) return 50;
  if (c >= 32 && c < 127) return (wt >= 600 ? PX600 : PX500)[c - 32];
  const e = PX_EXTRA[ch];
  return e ? e[wt >= 600 ? 1 : 0] : 60;

function pxw(s, size, wt) { let w = 0; for (const ch of s) w += adv(ch, wt || 500); return (w * size) / 100; }
function psw(s, size) { return [...s].length * size; }
// Cut a string to fit `width`, ending it with an ellipsis.
function clip(s, width, measure) {
  if (measure(s) <= width) return s;
  let t = s;
  while (t.length > 1 && measure(t.replace(/[\s·-]+$/, '') + '…') > width) t = t.slice(0, -1);
  return t.replace(/[\s·-]+$/, '') + '…';
}

function mix(a, b, t) {
  const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const [x, y] = [p(a), p(b)];
  return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join('').toUpperCase();

// ---- Headlines.
// Pieces to set: words, plus (when allowed) the parts of a word after its own hyphens.
function pieces(text, hyphens) {
  const out = [];
  text.split(/\s+/).filter(Boolean).forEach((w, wi) => {
    (hyphens ? w.split(/(?<=-)/) : [w]).forEach((p, pi) => out.push({ s: p, glue: pi === 0 && wi > 0 ? ' ' : '' }));
  });
  return out;
}
// Least squared slack over every line but the last, in at most maxLines lines.
function wrapBalanced(text, size, width, maxLines, hyphens) {
  const t = pieces(text, hyphens), n = t.length;
  const W = (s) => pxw(s, size, 500);
  if (!n || t.some((x) => W(x.s) > width)) return null;
  const line = (i, j) => t.slice(i, j).map((x, k) => (k ? x.glue : '') + x.s).join('');
  const best = Array.from({ length: n + 1 }, () => Array(maxLines + 1).fill(null));
  for (let k = 0; k <= maxLines; k++) best[n][k] = { c: 0, j: n };
  for (let i = n - 1; i >= 0; i--) {
    for (let k = 1; k <= maxLines; k++) {
      let b = null;
      for (let j = i + 1; j <= n; j++) {
        const w = W(line(i, j));
        if (w > width) break;
        const rest = best[j][k - 1];
        if (!rest) continue;
        const slack = (width - w) / width;
        let c = j === n ? 0 : slack * slack;
        if (j === n && i > 0 && j - i === 1 && w < width * 0.34) c += 0.12;
        if (j < n && t[j].glue === '') c += 0.04;
        c += rest.c;
        if (!b || c < b.c) b = { c, j };
      }
      best[i][k] = b;
    }
  }
  if (!best[0][maxLines]) return null;
  const lines = [];
  for (let i = 0, k = maxLines; i < n; k--) { const b = best[i][k]; lines.push(line(i, b.j)); i = b.j; }
  return { lines, cost: best[0][maxLines].c };
}
// Last resort for a word wider than the box: greedy, with an added hyphen (three letters a side).
function wrapHard(text, size, width) {
  const W = (s) => pxw(s, size, 500);
  const lines = [];
  let cur = '';
  const place = (piece, glue) => { const next = cur ? cur + glue + piece : piece; if (W(next) <= width) cur = next; else { if (cur) lines.push(cur); cur = piece; } };
  for (const word of text.split(/\s+/).filter(Boolean)) {
    let glue = ' ';
    for (let piece of word.split(/(?<=-)/)) {
      while (W(piece) > width) {
        let cut = piece.replace(/-$/, '').length - 3;
        while (cut > 3 && W(piece.slice(0, cut) + '-') > width) cut--;
        place(piece.slice(0, cut) + '-', glue);
        if (cur) lines.push(cur);
        cur = '';
        glue = '';
        piece = piece.slice(cut);
      }
      place(piece, glue);
      glue = '';
    }
  }
  if (cur) lines.push(cur);
  return lines;
}
// The builder's headline: 14px down to 11px. Every size is tried and the most even wrap wins, with a
// small cost per step down. Words break at their own hyphens only when nothing else fits.
function fitHeadline(text, width, maxLines) {
  for (const hyphens of [false, true]) {
    let pick = null;
    for (const size of [14, 13, 12, 11]) {
      const r = wrapBalanced(text, size, width, maxLines, hyphens);
      if (!r) continue;
      const score = r.cost + (14 - size) * 0.3 + r.lines.length * 0.03;
      if (!pick || score < pick.score) pick = { size, lines: r.lines, score };
    }
    if (pick) return pick;
  }
  const size = 11;
  let lines = wrapHard(text, size, width);
  if (lines.length > maxLines) {
    lines = lines.slice(0, maxLines);
    let last = lines[maxLines - 1];
    while (last.length > 1 && pxw(last + '…', size, 500) > width) last = last.slice(0, -1);
    lines[maxLines - 1] = last.replace(/[\s-]+$/, '') + '…';
  }
  return { size, lines };
}

    const ol = dark ? '#03040E' : '#1B1F3B';
    const topProj = (c) => { const e = Object.entries(c).sort((p, q) => q[1] - p[1] || rank(p[0]) - rank(q[0])); return e.length ? colOf(e[0][0]) : null; };

      if (palette.length < 2) palette.push(mix(palette[0], '#FFFFFF', 0.35));
      [[52, -12], [-16, -4], [56, 28], [-20, 24]].filter(([dx, dy]) => {
        const s = { x: x.pennant.x + dx - P, y: x.pennant.y + dy, w: 3 * P, h: 3 * P };
        if (hit(s)) return false;
        obstacles.push(s);
        return true;
      }).slice(0, 2).forEach(([dx, dy], i) => {
        const sx = x.pennant.x + dx, sy = x.pennant.y + dy;
        fx(spark, R(sx, sy, P, P) + R(sx - P, sy + P, 3 * P, P) + R(sx, sy + 2 * P, P, P), i ? 0.7 : 1);
      });
      const cands = [];
      for (let dy = -112; dy <= 72; dy += 16) for (let dx = -176; dx <= 176; dx += 16) if (Math.abs(dx) >= 40) cands.push({ dx, dy });
      const picked = [];
      [[28, 24, 20, 16], [24, 20, 16]].forEach((radii, idx) => {
        let best = null;
        for (const [own, strict] of [[true, true], [true, false], [false, true], [false, false]]) {
          for (const r of radii) {
            for (const c of cands) {
              const cx = snap(pc.x + c.dx), cy = snap(pc.y + c.dy);
              const box = { x: cx - r - 4, y: cy - r - 4, w: 2 * r + 12, h: 2 * r + 40 };
              if (box.x < 8 || box.x + box.w > 1192 || box.y < 100 || box.y + box.h > GY - 8) continue;
              if (own && (box.x < x.zx - 24 || box.x + box.w > x.zx + 150 + 24)) continue;
              if (hit(box)) continue;
              if (strict && picked.length && Math.sign(c.dx) === Math.sign(picked[0].dx)) continue;
              const score = Math.hypot(c.dx, c.dy * 1.3) + (c.dy > 8 ? 24 : 0) + (28 - r) * 2;
              if (!best || score < best.score) best = { ...c, cx, cy, box, r, score };
            }
          }
          if (best) break;
        }
        if (best) {
          burst(best.cx, best.cy, best.r, palette[idx % palette.length]);
          picked.push(best);
          obstacles.push(best.box);
        }
      });
    });

    // A shooting star on night skies, where the sky is clear.
    if (kind === 'night') {
      for (const [sx, sy] of [[652, 232], [300, 264], [856, 204], [420, 196], [176, 236], [760, 280]]) {
        const box = { x: sx - 28, y: sy - 28, w: 36, h: 36 };
        if (hit(box)) continue;
        for (let k = 0; k < 6; k++) deco('#FFFFFF', R(sx - k * P, sy - k * P, P, P), +(1 - k * 0.15).toFixed(2));
        deco('#FFFFFF', R(sx + P, sy, P, P) + R(sx, sy + P, P, P), 0.35);
        break;
      }
    }

    // Flowers in the grass, away from the towers, the camp and the door.
    const flowerCols = dark ? ['#FF8FB1', '#FFE27A', '#E9E6F2'] : ['#FF6F9C', '#FFD23F', '#FFFFFF'];
    for (let i = 0; i < 18; i++) {
      const x = snap(16 + rnd() * 1040);
      const clear = { x: x - 4, y: GY - 12, w: 12, h: 12 };
      if (hit(clear)) continue;
      ground(G.tuft, R(x, GY - P, P, P));
      ground(flowerCols[i % 3], R(x, GY - 2 * P, P, P));
    }

    // ---- Dialog boxes and their dotted tails. Launch boxes lead in gold; the rest sit back.
    days.forEach((x) => {
      const bx = x.box;
      if (!bx) return;
      if (x.shipped) {
        boxShadow(dark ? '#000000' : '#1B1F3B', notch(bx.x + P, bx.y + P, bx.w, bx.h), dark ? 0.4 : 0.25);
        boxOuter(dark ? '#03040E' : '#1B1F3B', notch(bx.x, bx.y, bx.w, bx.h));
        boxMid('#FFCB2E', notch(bx.x + P, bx.y + P, bx.w - 2 * P, bx.h - 2 * P));
        boxInner(dark ? '#141A4A' : '#FFFDF4', notch(bx.x + 2 * P, bx.y + 2 * P, bx.w - 4 * P, bx.h - 4 * P));
      } else {
        boxOuter(dark ? '#03040E' : '#1B1F3B', notch(bx.x, bx.y, bx.w, bx.h), dark ? 0.85 : 0.75);
        boxInner(dark ? '#0B0F2C' : '#FFFFFF', notch(bx.x + P, bx.y + P, bx.w - 2 * P, bx.h - 2 * P), dark ? 0.82 : 0.86);
      }
      if (x.tail) {
        let dots = '';
        for (let y = x.tail.y0; y + P <= x.tail.y1; y += 12) dots += R(x.tail.x, y, P, P);
        tails(dark ? '#E9E6F2' : '#1B1F3B', dots, 0.6);
      }
      const tag = x.shipped ? 'SHIPPED!' : x.posted ? 'POSTED' : 'BUILT';
      const tagColor = x.shipped ? (dark ? '#FFD54A' : '#B7791F') : x.posted ? (dark ? '#7FD4FF' : '#1D7FC4') : (dark ? '#9BE38A' : '#2F8A3A');
      T({ x: bx.x + 14, y: bx.y + 14, w: bx.w - 28, s: 8, c: tagColor, t: tag });
      const ink = dark ? (x.shipped ? '#FFFFFF' : '#E4E2F0') : '#1B1F3B';
      bx.lines.forEach((line, li) => T({ x: bx.x + 14, y: bx.y + 26 + li * bx.lh, w: bx.w - 28, s: bx.size, lh: bx.lh, font: PXF, wt: 500, c: ink, t: line }));
    });

    // ---- Ground labels.
    days.forEach((x) => {
      T({ x: x.zx, y: GY + 14, w: 150, a: 'center', s: 16, c: G.label, t: x.label, sh: hardShadow(16, '#000000') });
      const t = x.total ? `${x.total} COMMIT${x.total === 1 ? '' : 'S'}` : x.has ? 'NO COMMITS' : 'TOUCHED GRASS';
      T({ x: x.zx, y: GY + 38, w: 150, a: 'center', s: 8, c: x.total ? '#FFD54A' : G.mute, t });
    });

    // ---- HUD: the builder, the week, and three counters with the scene's own icons.
    const ink = '#FFFFFF', shade = dark ? '#000000' : '#1B1F3B';
    const weekTitle = `WEEK ${iso.w}`, dateLine = dates.toUpperCase();
    hud(shade, R(16, 12, 92, 92), dark ? 0.45 : 0.3);
    hud(dark ? '#03040E' : '#1B1F3B', R(12, 8, 92, 92));
    hud('#FFFFFF', R(16, 12, 84, 84));
    // The name and handle fit between the avatar and the week title (Press Start 2P: 1em a glyph).
    const titleL = 600 - psw(weekTitle, 32) / 2, dateL = 600 - psw(dateLine, 16) / 2;
    const nameMax = titleL - 24 - 124, handleMax = Math.min(titleL, dateL) - 24 - 124;
    const NAME = name.toUpperCase();
    const nameSize = psw(NAME, 28) <= nameMax ? 28 : psw(NAME, 24) <= nameMax ? 24 : 16;
    const nameText = clip(NAME, nameMax, (s) => psw(s, nameSize));
    T({ x: 124, y: nameSize === 16 ? 26 : 20, s: nameSize, c: ink, t: nameText, sh: hardShadow(nameSize, shade) });
    const lvTail = ` · LV ${level}`;
    const handleText = clip('@' + handle, handleMax - psw(lvTail, 8), (s) => psw(s, 8)) + lvTail;
    const hInk = skyInk(58);
    T({ x: 124, y: 62, s: 8, c: hInk.c, t: handleText, sh: hInk.sh ? hardShadow(8, hInk.sh) : 'none' });
    T({ x: 300, y: 14, w: 600, a: 'center', s: 32, c: ink, t: weekTitle, sh: hardShadow(32, shade) });
    const dInk = skyInk(58, '#FFE7C2');
    T({ x: 300, y: 56, w: 600, a: 'center', s: 16, c: dInk.c, t: dateLine, sh: dInk.sh ? hardShadow(16, dInk.sh) : 'none' });
    const top1 = projects.length ? colOf(projects[0][0]) : OTHER;
    const iconPal = {
      COMMITS: { h: mix(top1, '#FFFFFF', 0.38), b: top1, s: mix(top1, '#000000', 0.32) },
      SHIPPED: { y: '#FFD54A', p: '#D9DCEB', f: '#FFCB2E', F: '#E0950F' },
      POSTED: { r: '#FF4D4D', p: '#D9DCEB', a: '#7FD4FF' }
    };
    const counters = [['COMMITS', String(W.commits).padStart(3, '0'), ICON_BLOCK], ['SHIPPED', String(W.shipped), ICON_FLAG], ['POSTED', String(W.published), ICON_MAST]];
    const cw = counters.map(([, v]) => 24 + 6 + psw(v, 24));
    let cx0 = 1184 - cw.reduce((s, v) => s + v, 0) - 28 * (counters.length - 1);
    const lInk = skyInk(20);
    counters.forEach(([label, v, icon], i) => {
      const w = cw[i];
      T({ x: cx0 - 20, y: 18, w: w + 40, a: 'center', s: 8, c: lInk.c, t: label, sh: lInk.sh ? hardShadow(8, lInk.sh) : 'none' });
      const sh = {};
      Object.keys(iconPal[label]).forEach((k) => { sh[k] = shade; });
      bmp(hud, icon, cx0 + 3, 37, sh, 3);
      bmp(hud, icon, cx0, 34, iconPal[label], 3);
      T({ x: cx0 + 30, y: 34, s: 24, c: i === 1 && W.shipped ? '#FFD54A' : ink, t: v, sh: hardShadow(24, shade) });
      cx0 += w + 28;
    });

    // ---- Strip: next week's goal and the link, then the key and the series.
    strip('#000000', R(0, 578, 1200, 52), dark ? 0.45 : 0.32);
    T({ x: 18, y: 585, s: 16, c: '#FFD54A', t: 'NEXT' });
    strip('#FFD54A', R(86, 587, 4, 12) + R(90, 589, 4, 8) + R(94, 591, 4, 4));
    const link = `openstage.dev/${handle}`;
    const linkSize = psw(link, 16) <= 480 ? 16 : 12;
    const linkW = psw(link, linkSize), linkX = 1182 - linkW;
    const goalX = 108, goalMax = linkX - 24 - goalX;
    let goalSize = 18;
    while (goalSize > 14 && pxw(W.goal, goalSize, 600) > goalMax) goalSize--;
    const goal = clip(W.goal, goalMax, (s) => pxw(s, goalSize, 600));
    T({ x: goalX, y: 583 + (18 - goalSize) / 2, w: goalMax + 8, s: goalSize, lh: 22, font: PXF, wt: 600, c: '#FFFFFF', t: goal });
    T({ x: linkX, y: 585 + (16 - linkSize) / 2, w: linkW, a: 'right', s: linkSize, c: '#FFFFFF', t: link });
    const series = `OPENSTAGE · W${iso.w}/${iso.y}`;
    T({ x: 1182 - psw(series, 8), y: 611, w: psw(series, 8), a: 'right', s: 8, c: '#FFE7C2', t: series });
    const keyLabel = projects.length ? `1 BLOCK = ${per} COMMIT${per === 1 ? '' : 'S'}` : '1 FIRE = 1 DAY OFF';
    T({ x: 18, y: 611, s: 8, c: '#FFE7C2', t: keyLabel });
    let lx = 18 + psw(keyLabel, 8) + 16;
    const keyLimit = 1182 - psw(series, 8) - 24;
    const swatch = (x0, c, sz) => {
      strip(c, R(x0, 610, sz, sz));
      strip(mix(c, '#FFFFFF', 0.4), R(x0, 610, sz, 2) + R(x0, 612, 2, sz - 2));
      strip(mix(c, '#000000', 0.3), R(x0 + 2, 608 + sz, sz - 2, 2) + R(x0 + sz - 2, 612, 2, sz - 4));
    };
    let shown = 0;
    for (const [pname, n] of projects) {
      const nameW = Math.ceil(pxw(pname, 13, 500)), numW = psw(String(n), 8);
      const w = 16 + nameW + 6 + numW + 18;
      const left = projects.length - shown - 1;
      const restW = left > 0 ? 16 + Math.min(left, 3) * 12 + psw(`+${left} MORE`, 8) : 0;
      if (shown >= 4 || lx + w + restW > keyLimit) break;
      swatch(lx, colOf(pname), 10);
      T({ x: lx + 16, y: 606, w: 400, s: 13, lh: 16, font: PXF, wt: 500, c: '#FFFFFF', t: pname });
      T({ x: lx + 16 + nameW + 6, y: 611, s: 8, c: '#FFFFFF', t: String(n) });
      lx += w;
      shown++;
    }
    if (projects.length > shown) {
      projects.slice(shown, shown + 3).forEach(([pname], i) => swatch(lx + i * 12, colOf(pname), 8));
      const more = projects.length - shown;
      T({ x: lx + Math.min(more, 3) * 12 + 4, y: 611, s: 8, c: '#FFE7C2', t: `+${more} MORE` });
    }

    const layers = [];
    stages.forEach((m) => m.forEach((d, k) => { const [f, o] = k.split('|'); layers.push({ d, f, o }); }));
    return { skyTop: S.bands[0], layers, texts, head };
  }
}
