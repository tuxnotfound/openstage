<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The fonts librsvg draws SVG text with (share cards, the email chart):
     Funnel from vendor/fonts, on top of the system's, which fill in any
     glyph Funnel lacks. Loaded by config/initializers/fonts.rb. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <include ignore_missing="yes">/opt/homebrew/etc/fonts/fonts.conf</include>
  <include ignore_missing="yes">/usr/local/etc/fonts/fonts.conf</include>
  <dir prefix="relative">../vendor/fonts</dir>
</fontconfig>
